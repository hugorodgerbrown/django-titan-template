[project]
name = "ultraniche-homepage"
version = "0.1.0"
description = "The ultraniche.ai homepage: a static page built from apps.json."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff>=0.6"]

[tool.uv]
default-groups = ["test", "lint"]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
