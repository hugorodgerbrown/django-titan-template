# Lint, type-check and test titan, the app provisioner (titan/). It talks to
# Render, Resend, GitHub, 1Password and shared-db; the tests fake all of them.
name: titan

on:
  push:
    branches: [main]
    paths: ["titan/**", ".github/workflows/titan.yml"]
  pull_request:
    paths: ["titan/**", ".github/workflows/titan.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: titan

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync --locked --python 3.14
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
      - name: Installs as a tool
        run: |
          uv tool install --python 3.14 .
          titan --version
