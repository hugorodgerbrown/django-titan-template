# Lint, test and build the ultraniche.ai homepage (homepage/), a static
# page Render builds from apps.json with plain python3.
name: homepage

on:
  push:
    branches: [main]
    paths: ["homepage/**", ".github/workflows/homepage.yml"]
  pull_request:
    paths: ["homepage/**", ".github/workflows/homepage.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: homepage

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: Build as Render does
        run: python3 build.py
