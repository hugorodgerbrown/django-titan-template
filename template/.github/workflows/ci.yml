name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new CVE in a pinned dependency shows up without a push.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per tox env: the same commands as `uv run tox` locally.
  tox:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [fmt, lint, types, checks, test, js, audit, sast, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - if: matrix.env == 'js' || matrix.env == 'audit'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - if: matrix.env == 'e2e'
        name: Install Chromium for Playwright
        run: uv run --frozen --only-group e2e playwright install --with-deps chromium
      - name: Run tox -e ${{ matrix.env }}
        run: uvx --with tox-uv tox -e ${{ matrix.env }}

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    # gitleaks-action reads the PR's commit range through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
