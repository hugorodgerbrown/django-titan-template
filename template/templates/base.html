{% load static %}<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}{{ pwa.name }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ pwa.name }}{% endblock %}">
    <meta name="theme-color" content="{{ pwa.theme_colour }}">
    {# The outbox reads these to send queued writes as the right user. #}
    <meta name="app-principal" content="{{ request.user.pk|default_if_none:'' }}">
    <meta name="csrf-token" content="{{ csrf_token }}">
    {# No eval, no injected <style>: both would need a looser CSP. #}
    <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false}'>
    <link rel="manifest" href="{% url 'pwa:manifest' %}">
    <link rel="icon" href="{% static 'icons/icon-192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {# Blocking on purpose and tiny: decides before first paint whether the launch screen shows. #}
    <script src="{% static 'js/launch_gate.js' %}"></script>
    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'js/idb.js' %}" defer></script>
    <script src="{% static 'js/outbox_core.js' %}" defer></script>
    <script src="{% static 'js/outbox.js' %}" defer></script>
    <script src="{% static 'js/pwa.js' %}" defer></script>
    <script src="{% static 'js/launch_shell.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
  </head>
  <body>
    {% include "includes/_launch_shell.html" %}
    <header class="app-header">
      <a class="app-header__name" href="{% url 'home' %}">{{ pwa.name }}</a>
      {% include "includes/_outbox_status.html" %}
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="button button--quiet" type="submit">Sign out</button>
        </form>
      {% endif %}
    </header>
    <div class="offline-banner" data-offline-banner hidden>
      You're offline. Changes are saved on this device and sent when you're back.
    </div>
    <main class="app-main">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
